# Render Blueprint for the backend — see README.md "Deploying".
# In Render: New -> Blueprint -> pick this repo. Render reads this file and
# creates the service below; you'll be prompted for the envVars marked
# `sync: false` (never store secrets in this file).
services:
  - type: web
    name: clearsign-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION # Render's top-priority Node setting; without it Render uses the newest Node allowed by "engines"
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY # Render's proxy hop; lets the rate limit see each visitor's real IP
        value: "1"
