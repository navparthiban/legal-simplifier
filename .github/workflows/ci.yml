name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read # read-only: the workflow can't change the repo

concurrency: # a newer push to the same PR/branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.package }})
    runs-on: ubuntu-24.04 # pinned so the OS doesn't change under us when ubuntu-latest moves
    timeout-minutes: 10
    strategy:
      fail-fast: false # report both results even if one fails
      matrix:
        package: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # package.json "engines": ">=24" — test the minimum we promise
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
