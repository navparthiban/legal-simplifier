# Netlify deploys the frontend only — see README.md "Deploying" for the
# backend (Render) half and how the two are wired together.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Pin the Node version Netlify builds with (netlify.toml overrides the dashboard).
[build.environment]
  NODE_VERSION = "24"
